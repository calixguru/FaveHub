
<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://unpkg.com/tailwindcss@^2/dist/tailwind.min.css" rel="stylesheet">

    <!-- AOS -->
    <link rel="stylesheet" href="https://unpkg.com/aos@next/dist/aos.css" />

    <link rel="preconnect" href="https://fonts.gstatic.com">
    <script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@10">
    <link href='https://fonts.googleapis.com/css?family=Baloo+2&display=swap' rel='stylesheet'>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
            integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw=="
            crossorigin="anonymous" referrerpolicy="no-referrer" />
    
    <link rel="icon" type="image/png" href="/static/img/logo2.png">
    <title>FaveHub</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',

            theme: {
                extend: {
                    colors: {
                        brand: {
                            400: '#60a5fa',
                            500: '#3b82f6',
                            600: '#2563eb',
                        }
                    }
                }
            }
        }
    </script>
    <style>
    body {
            font-family: 'Baloo 2', cursive;
        }
    </style>
</head>

<body class="
    min-h-screen
    bg-slate-50
    text-slate-900
    dark:bg-slate-950
    dark:text-white
    transition-colors
    duration-300
">
        <main
            data-auth="required"
            class="
                min-h-screen
                bg-slate-50
                dark:bg-slate-950
                text-slate-900
                dark:text-white
            "
        >

            <section>

                <div class="
                    max-w-4xl
                    mx-auto
                    px-5 sm:px-8
                    py-12
                ">

                    <!-- HEADER -->

                    <div class="
                        flex
                        items-center
                        justify-between
                        gap-4
                    ">

                        <div>

                            <div class="
                                text-[10px]
                                uppercase
                                tracking-[0.2em]
                                font-bold
                                text-blue-600
                                dark:text-blue-400
                            ">
                                Account
                            </div>

                            <h1 class="
                                mt-2
                                text-3xl
                                font-black
                            ">
                                Transaction History
                            </h1>

                            <p class="
                                mt-2
                                text-sm
                                text-slate-500
                                dark:text-white/40
                            ">
                                View your data and airtime purchases.
                            </p>

                        </div>


                        <a
                            href="/app"
                            class="
                                hidden sm:flex
                                h-10
                                px-4
                                items-center
                                rounded-xl
                                border
                                border-slate-200
                                dark:border-white/10
                                text-sm
                                font-semibold
                                hover:bg-slate-100
                                dark:hover:bg-white/5
                            "
                        >
                            ← Dashboard
                        </a>

                    </div>


                    <!-- TRANSACTIONS -->

                    <div
                        id="transactionsContainer"
                        class="
                            mt-8
                            space-y-3
                        "
                    >
                    </div>


                    <!-- LOADING -->

                    <div
                        id="loadingState"
                        class="
                            py-16
                            text-center
                            text-sm
                            text-slate-400
                        "
                    >
                        Loading transactions...
                    </div>


                    <!-- EMPTY -->

                    <div
                        id="emptyState"
                        class="
                            hidden
                            py-20
                            text-center
                        "
                    >

                        <div class="
                            mx-auto
                            w-14 h-14
                            rounded-2xl
                            bg-blue-500/10
                            flex
                            items-center
                            justify-center
                            text-blue-500
                            text-xl
                        ">
                            ◉
                        </div>


                        <h2 class="
                            mt-5
                            font-bold
                        ">
                            No transactions yet
                        </h2>


                        <p class="
                            mt-2
                            text-sm
                            text-slate-400
                        ">
                            Your data and airtime purchases
                            will appear here.
                        </p>


                        <a
                            href="/buy"
                            class="
                                inline-flex
                                mt-6
                                h-11
                                px-5
                                items-center
                                rounded-xl
                                bg-blue-600
                                text-white
                                text-sm
                                font-semibold
                            "
                        >
                            Buy Data or Airtime
                        </a>

                    </div>

                </div>

            </section>

        </main>

    <script src="js/transactions.js"></script>
    <script src="js/api.js"></script>
    <script src="js/toggle.js"></script>
    <script src="js/chat.js"></script>
    <script src="js/layout.js"></script>
</body>
</html>
