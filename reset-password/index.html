
<!DOCTYPE html>
<html lang="en" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://unpkg.com/tailwindcss@^2/dist/tailwind.min.css" rel="stylesheet">

    <!-- AOS -->
    <link rel="stylesheet" href="https://unpkg.com/aos@next/dist/aos.css" />

    <link rel="preconnect" href="https://fonts.gstatic.com">
    <script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@10">
    <link href='https://fonts.googleapis.com/css?family=Baloo+2&display=swap' rel='stylesheet'>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
            integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw=="
            crossorigin="anonymous" referrerpolicy="no-referrer" />
    
    <link rel="icon" type="image/png" href="/static/img/logo2.png">
    <title>FaveHub</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',

            theme: {
                extend: {
                    colors: {
                        brand: {
                            400: '#60a5fa',
                            500: '#3b82f6',
                            600: '#2563eb',
                        }
                    }
                }
            }
        }
    </script>
    <style>
    body {
            font-family: 'Baloo 2', cursive;
        }
    </style>
</head>

<body
    class="
        min-h-screen
        bg-slate-50
        text-slate-900
        dark:bg-slate-950
        dark:text-white
        transition-colors
        duration-300
    "
>


    <main
        class="
            min-h-screen
            flex
            items-center
            justify-center
            px-4
            py-12
        "
    >

        <div class="w-full max-w-md">


            <!-- CARD -->

            <div
                class="
                    rounded-3xl
                    border
                    border-slate-200
                    dark:border-white/10
                    bg-white
                    dark:bg-white/[0.035]
                    backdrop-blur-xl
                    shadow-2xl
                    overflow-hidden
                "
            >

                <div class="p-7 sm:p-9">


                    <!-- ICON -->

                    <div
                        id="resetIcon"
                        class="
                            mx-auto
                            w-16
                            h-16
                            rounded-2xl
                            bg-blue-600/10
                            text-blue-600
                            dark:bg-blue-500/10
                            dark:text-blue-400
                            flex
                            items-center
                            justify-center
                            text-2xl
                        "
                    >
                        🔑
                    </div>


                    <!-- TITLE -->

                    <div class="text-center mt-6">

                        <h1
                            id="resetTitle"
                            class="
                                text-2xl
                                font-bold
                                tracking-tight
                            "
                        >
                            Create a new password
                        </h1>

                        <p
                            id="resetDescription"
                            class="
                                mt-2
                                text-sm
                                text-slate-500
                                dark:text-white/40
                            "
                        >
                            Choose a strong password for your
                            FaveHub account.
                        </p>

                    </div>


                    <!-- FORM -->

                    <form
                        id="resetPasswordForm"
                        class="mt-8"
                    >

                        <!-- ERROR -->

                        <div
                            id="resetPasswordError"
                            class="
                                hidden
                                mb-5
                                rounded-xl
                                border
                                border-red-200
                                dark:border-red-500/20
                                bg-red-50
                                dark:bg-red-500/10
                                px-4
                                py-3
                                text-sm
                                text-red-600
                                dark:text-red-400
                            "
                        ></div>


                        <!-- SUCCESS -->

                        <div
                            id="resetPasswordSuccess"
                            class="
                                hidden
                                mb-5
                                rounded-xl
                                border
                                border-green-200
                                dark:border-green-500/20
                                bg-green-50
                                dark:bg-green-500/10
                                px-4
                                py-4
                                text-sm
                                text-green-700
                                dark:text-green-400
                            "
                        >

                            <div class="flex gap-3">

                                <span class="text-lg">
                                    ✓
                                </span>

                                <div>

                                    <div class="font-semibold">
                                        Password changed successfully
                                    </div>

                                    <div class="mt-1 text-xs opacity-80">
                                        Redirecting you to login...
                                    </div>

                                </div>

                            </div>

                        </div>


                        <!-- PASSWORD -->

                        <div>

                            <label
                                for="password"
                                class="
                                    block
                                    text-sm
                                    font-semibold
                                    mb-2
                                "
                            >
                                New password
                            </label>

                            <div class="relative">

                                <input
                                    id="password"
                                    type="password"
                                    autocomplete="new-password"
                                    placeholder="Enter your new password"
                                    class="
                                        w-full
                                        h-12
                                        rounded-xl
                                        border
                                        border-slate-200
                                        dark:border-white/10
                                        bg-slate-50
                                        dark:bg-white/5
                                        px-4
                                        pr-12
                                        text-sm
                                        outline-none
                                        transition
                                        focus:border-blue-500
                                        focus:ring-2
                                        focus:ring-blue-500/10
                                        text-slate-900
                                        dark:text-white
                                        placeholder:text-slate-400
                                        dark:placeholder:text-white/25
                                    "
                                >

                                <button
                                    id="togglePassword"
                                    type="button"
                                    class="
                                        absolute
                                        right-3
                                        top-1/2
                                        -translate-y-1/2
                                        text-slate-400
                                        dark:text-white/30
                                        hover:text-blue-500
                                    "
                                >
                                    👁
                                </button>

                            </div>

                        </div>


                        <!-- CONFIRM PASSWORD -->

                        <div class="mt-4">

                            <label
                                for="confirmPassword"
                                class="
                                    block
                                    text-sm
                                    font-semibold
                                    mb-2
                                "
                            >
                                Confirm new password
                            </label>

                            <div class="relative">

                                <input
                                    id="confirmPassword"
                                    type="password"
                                    autocomplete="new-password"
                                    placeholder="Confirm your new password"
                                    class="
                                        w-full
                                        h-12
                                        rounded-xl
                                        border
                                        border-slate-200
                                        dark:border-white/10
                                        bg-slate-50
                                        dark:bg-white/5
                                        px-4
                                        pr-12
                                        text-sm
                                        outline-none
                                        transition
                                        focus:border-blue-500
                                        focus:ring-2
                                        focus:ring-blue-500/10
                                        text-slate-900
                                        dark:text-white
                                        placeholder:text-slate-400
                                        dark:placeholder:text-white/25
                                    "
                                >

                                <button
                                    id="toggleConfirmPassword"
                                    type="button"
                                    class="
                                        absolute
                                        right-3
                                        top-1/2
                                        -translate-y-1/2
                                        text-slate-400
                                        dark:text-white/30
                                        hover:text-blue-500
                                    "
                                >
                                    👁
                                </button>

                            </div>

                        </div>


                        <!-- PASSWORD REQUIREMENT -->

                        <div
                            class="
                                mt-4
                                text-xs
                                text-slate-400
                                dark:text-white/30
                            "
                        >
                            Password must contain at least
                            6 characters.
                        </div>


                        <!-- BUTTON -->

                        <button
                            id="resetPasswordButton"
                            type="submit"
                            class="
                                mt-6
                                w-full
                                h-12
                                rounded-xl
                                bg-blue-600
                                hover:bg-blue-500
                                text-white
                                font-semibold
                                transition
                                shadow-lg
                                shadow-blue-600/20
                                flex
                                items-center
                                justify-center
                                gap-2
                                disabled:opacity-60
                                disabled:cursor-not-allowed
                            "
                        >

                            <span id="resetButtonText">
                                Reset Password
                            </span>

                            <span
                                id="resetLoader"
                                class="hidden"
                            >

                                <span
                                    class="
                                        inline-block
                                        w-4
                                        h-4
                                        border-2
                                        border-white/30
                                        border-t-white
                                        rounded-full
                                        animate-spin
                                    "
                                ></span>

                            </span>

                        </button>

                    </form>


                    <!-- LOGIN -->

                    <div class="text-center mt-7">

                        <a
                            href="/FaveHub/login"
                            class="
                                text-sm
                                text-blue-600
                                dark:text-blue-400
                                hover:underline
                            "
                        >
                            ← Back to Login
                        </a>

                    </div>

                </div>

            </div>

        </div>

    </main>


    <script src="/FaveHub/api.js"></script>
    <script src="/FaveHub/toggle.js"></script>
    <script src="/FaveHub/layout.js"></script>

    <script src="reset-password.js"></script>

</body>

</html>
